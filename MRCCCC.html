<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahobilam Rooms Booking</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .booking-container {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border: 1px solid #d4af37;
        }
        h2 {
            text-align: center;
            color: #d4af37;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
        }
        .policy {
            background-color: #252525;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            border-left: 3px solid #d4af37;
            margin-bottom: 15px;
        }
        .qr-section {
            text-align: center;
            margin-bottom: 15px;
        }
        .qr-section img {
            width: 150px;
            height: 150px;
            background: #fff;
            padding: 5px;
            border-radius: 5px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            font-size: 15px;
        }
        .btn-pay {
            background-color: #512da8;
            color: white;
        }
        .btn-success {
            background-color: #1b5e20;
            color: white;
        }
        .btn-whatsapp {
            background-color: #25d366;
            color: white;
        }
        .btn:disabled {
            background-color: #555;
            cursor: not-allowed;
            opacity: 0.6;
        }
    </style>
</head>
<body>

<div class="booking-container">
    <h2>Ahobilam Rooms Booking</h2>
    
    <div class="form-group">
        <label>Check-in Date</label>
        <input type="date" id="checkin-date">
    </div>

    <div class="form-group">
        <label>Check-out Date</label>
        <input type="date" id="checkout-date">
    </div>

    <div class="form-group">
        <label>Number of Guests</label>
        <input type="number" id="guests" value="2" min="1">
    </div>

    <div class="policy">
        <strong>Booking & Cancellation Policy:</strong><br>
        Non-Refundable: The advance amount paid will not be refunded under any circumstances.
    </div>

    <div class="qr-section">
        <p><strong>Total: ₹10 | 50% Advance: ₹5</strong></p>
        <p style="font-size: 12px; color: #aaa;">Scan this QR code using PhonePe / GPay:</p>
        <!-- మీ QR కోడ్ ఇమేజ్ పాత్ ఇక్కడ ఇవ్వండి -->
        <img src="qr-code.png" alt="Payment QR Code">
    </div>

    <!-- పేమెంట్ వెరిఫికేషన్ కోసం UTR / Transaction ID ఫీల్డ్ -->
    <div class="form-group">
        <label for="utr-number">UPI Transaction ID / UTR (పేమెంట్ చేశాక ఇక్కడ ఎంటర్ చేయండి):</label>
        <input type="text" id="utr-number" placeholder="ఉదా: 3256XXXXXXXX">
    </div>

    <!-- పేమెంట్ పూర్తి అయిందని క్లిక్ చేసే బటన్ -->
    <button class="btn btn-success" onclick="verifyPayment()">✅ పేమెంట్ పూర్తి అయింది (Verify Payment)</button>

    <!-- వాట్సాప్ బటన్ (మొదట డిసేబుల్ ఉంటుంది) -->
    <button id="whatsapp-btn" class="btn btn-whatsapp" disabled onclick="sendToWhatsApp()">📲 Confirm & Send via WhatsApp</button>
</div>

<script>
    let isVerified = false;

    function verifyPayment() {
        let utrInput = document.getElementById('utr-number').value.trim();

        if (utrInput === "") {
            alert("దయచేసి పేమెంట్ చేసిన తర్వాత దాని ట్రాన్సాక్షన్ ఐడీ (UTR / Reference Number) ని ఎంటర్ చేయండి!");
            return;
        }

        // ఇక్కడ ట్రాన్సాక్షన్ ఐడీ ఎంటర్ చేయగానే పేమెంట్ కన్ఫర్మ్ అయినట్లు పరిగణించి వాట్సాప్ బటన్ ఎనేబుల్ చేస్తాం
        isVerified = true;
        alert("పేమెంట్ కన్ఫర్మ్ చేయబడింది! ఇప్పుడు వాట్సాప్ ద్వారా బుకింగ్ పంపవచ్చు.");
        
        let whatsappButton = document.getElementById('whatsapp-btn');
        whatsappButton.disabled = false;
        whatsappButton.style.opacity = "1";
    }

    function sendToWhatsApp() {
        if (!isVerified) {
            alert("దయచేసి ముందుగా పేమెంట్ పూర్తి చేసి వెరిఫై చేయండి!");
            return;
        }

        let checkin = document.getElementById('checkin-date').value;
        let checkout = document.getElementById('checkout-date').value;
        let guests = document.getElementById('guests').value;
        let utr = document.getElementById('utr-number').value;

        let phoneNumber = "91XXXXXXXXXX"; // మీ ఏజెంట్ వాట్సాప్ నంబర్ ఇక్కడ ఇవ్వండి (Country code తో సహా)
        
        let message = `*కొత్త రూమ్ బుకింగ్ అభ్యర్థన (AhobilamRooms)*\n\n` +
                      `📅 Check-in: ${checkin}\n` +
                      `📅 Check-out: ${checkout}\n` +
                      `👥 Guests: ${guests}\n` +
                      `💳 UTR / Transaction ID: ${utr}\n` +
                      `🔍 Status: పేమెంట్ చేశాను, ఏజెంట్ కన్ఫర్మేషన్ కోసం ఎదురుచూస్తున్నాను.`;

        let encodedMessage = encodeURIComponent(message);
        let whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodedMessage}`;

        window.open(whatsappUrl, '_blank');
    }
</script>

</body>
</html>
