<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Stay</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .booking-card {
            background-color: #1a1a1a;
            border: 2px solid #d4af37;
            border-radius: 12px;
            padding: 20px;
            width: 350px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 {
            color: #d4af37;
            margin-bottom: 10px;
        }
        .amount {
            color: #2ecc71;
            font-size: 22px;
            font-weight: bold;
            margin: 15px 0;
        }
        .qr-container img {
            width: 200px;
            height: 200px;
            background-color: #fff;
            padding: 10px;
            border-radius: 8px;
        }
        .upi-id {
            color: #f1c40f;
            margin: 10px 0;
            font-size: 14px;
        }
        .notice {
            background-color: #0e291e;
            border: 1px dashed #2ecc71;
            padding: 10px;
            font-size: 12px;
            color: #ddd;
            border-radius: 6px;
            margin: 15px 0;
            text-align: left;
        }
        .whatsapp-btn {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .whatsapp-btn:hover {
            background-color: #20ba5a;
        }
    </style>
</head>
<body>

    <div class="booking-card">
        <h2>📅 Book Your Stay</h2>
        <p><strong>Scan QR to pay the amount for 2 days</strong></p>
        
        <div class="amount">Total Amount Payable: ₹3000</div>
        
        <div class="qr-container">
            <!-- మీ QR కోడ్ ఇమేజ్ లింక్ ఇక్కడ ఇవ్వండి -->
            <img src="YOUR_QR_CODE_IMAGE_URL_OR_PATH" alt="Payment QR Code">
        </div>
        
        <div class="upi-id">UPI ID: <strong>dhanunjayamadham@ybl</strong></div>
        
        <div class="notice">
            ℹ️ <strong>Important:</strong> Please share the full payment screenshot of PhonePe / GPay details on WhatsApp to confirm your room reservation.
        </div>
        
        <a href="https://wa.me/?text=Hi,%20I%20have%20paid%20₹3000%20for%202%20days%20room%20rent.%20Here%20is%20my%20screenshot." class="whatsapp-btn" target="_blank">
            💬 Send Details & Screenshot to WhatsApp
        </a>
    </div>

</body>
</html>
